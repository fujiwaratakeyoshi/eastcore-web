name: 公開（GitHub Pages・常時公開）

# 手動実行で公開する。停止したい時は stop-pages.yml を実行する。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行は1つに制限
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Astroビルド（サブパス・noindex）
        env:
          SITE: https://fujiwaratakeyoshi.github.io
          BASE_PATH: /eastcore-web
          PUBLIC_NOINDEX: "1" # プレビューは検索に出さない
        run: npm run build
      - name: Pages設定
        # ※事前に Settings > Pages > Source を "GitHub Actions" に設定しておくこと
        uses: actions/configure-pages@v5
      - name: 成果物アップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: デプロイ
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 公開URL
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: echo "公開URL → $PAGE_URL"
